[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bosch-production-fault-predictor"
version = "0.1.0"
description = "Survival-analysis + station-attribution SHAP on the Bosch Production Line Performance dataset (14 GB, 1.18M parts, 51 stations, 0.6% fail rate)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dmitry Shurkhai", email = "etozhejimmy@gmail.com" }]
keywords = ["manufacturing", "predictive-quality", "survival-analysis", "shap", "xgboost", "kaggle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lifelines>=0.28.0",
    "shap>=0.44.0",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
    "pyyaml>=6.0",
    "joblib>=1.4.0",
    "kaggle>=1.6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
